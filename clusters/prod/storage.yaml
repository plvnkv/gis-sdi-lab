apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gis-storage
  namespace: argocd
spec:
  project: gis-storage
  source:
    repoURL: https://github.com/plvnkv/gis-sdi-lab.git
    targetRevision: main
    path: platform/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: gis
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
