apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gis-bootstrap
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/plvnkv/gis-sdi-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
